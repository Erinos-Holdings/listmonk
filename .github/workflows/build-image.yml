# Builds this fork into an arm64 image for the ListmonkEval host (t4g.small) and
# publishes it to GHCR. The host is too small to build on — 2 vCPU / 2 GB running
# Postgres, listmonk and Caddy — so the build has to happen here.
#
# See "The fork" in integrations/listmonk/LISTMONK-RUNBOOK.md.
name: Build arm64 image

on:
  push:
    branches:
      - master
      - "feat/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # GHCR requires a lowercase path; the org name is mixed case.
  IMAGE_NAME: erinos-holdings/listmonk

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          # The Makefile derives VERSION from `git describe --tags`.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # yarn 1.22.x is pinned via "packageManager" in the frontend package.json.
      - name: Enable corepack
        run: corepack enable

      # stuffbin runs ON the runner, so it must stay amd64. Install it before
      # GOARCH is switched to arm64 for the listmonk binary itself.
      - name: Install stuffbin
        run: go install github.com/knadh/stuffbin/...@latest

      # Backend Go tests (fork deltas: the media upload optimizer, the dark-mode
      # classifier, and the cmd/ originals-retention and reprocess tests -- cmd/ is
      # testable since the isTestBinary() guard in cmd/main.go short-circuits the
      # runtime init for a test binary).
      - name: Go tests
        run: go test ./internal/... ./cmd/...

      # The in-tree smtppool fork (internal/smtppool, a NESTED module wired by a go.mod
      # replace) is excluded from ./internal/... by Go's module boundary, so its tests
      # — the 4yz retry classifier and the fresh-connection retry (SEND-RETRY-SPEC I4)
      # — run separately. MailHog-backed upstream tests skip themselves when absent.
      - name: smtppool fork tests
        run: cd internal/smtppool && go test ./...

      # Structural tests for the Outlook post-processor (fork delta). These
      # gate the image: a broken conditional/dual-emit structure must never
      # ship. They do NOT replace the four-client rendering verification —
      # see the postProcess.ts fork-delta note in the listmonk runbook.
      - name: Email-builder tests
        run: |
          yarn --cwd frontend/email-builder install --frozen-lockfile
          yarn --cwd frontend/email-builder test

      # The image tag AND the version the app reports (Settings header, /api/config,
      # the boot log) — `<upstream tag>-erinos.<run number>`, so the UI shows exactly
      # which fork build is running. The Makefile honours LISTMONK_VERSION; the app's
      # update checker strips the -suffix before comparing, so upstream releases are
      # still detected. Resolved BEFORE the build steps so ldflags carry it.
      - name: Resolve version
        id: ver
        run: |
          base="$(git describe --tags --abbrev=0)"
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          echo "full=${base}-erinos.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build frontend
        env:
          LISTMONK_VERSION: ${{ steps.ver.outputs.full }}
        run: make build-frontend

      # The render canary, builder half (integrations INSPECT-SCOPE-SPEC §2.1): compile the
      # canary corpus with the bundle just built and write render-canary.json beside it in
      # frontend/dist, AFTER build-frontend and BEFORE pack-bin so the file is packed into the
      # binary (served at /admin/static/email-builder/render-canary.json; the server half hashes
      # it through the send path at startup). A missing file makes the canary endpoint 503 and
      # the review's structure check fail closed.
      - name: Render canary
        run: >-
          node frontend/email-builder/test/build-canary.cjs
          --umd frontend/dist/static/email-builder/email-builder.umd.js
          --out frontend/dist/static/email-builder/render-canary.json

      # The server half over the REAL corpus (INSPECT-SCOPE-SPEC §7 Stage 4 #5): every corpus
      # document must render through the send path, or the image would boot with a 503 canary
      # and every review would fail closed. The Go tests step above ran before the file existed.
      - name: Render canary (server half)
        env:
          RENDER_CANARY_FILE: ${{ github.workspace }}/frontend/dist/static/email-builder/render-canary.json
        run: go test ./cmd/ -run '^TestRenderCanaryRealCorpus$' -v

      - name: Build arm64 binary and pack static assets into it
        env:
          LISTMONK_VERSION: ${{ steps.ver.outputs.full }}
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
        run: make build pack-bin

      # QEMU is needed because the Dockerfile has RUN steps (apk add, chmod)
      # that execute inside the arm64 image.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=${{ steps.ver.outputs.full }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
