# Builds this fork into an arm64 image for the ListmonkEval host (t4g.small) and
# publishes it to GHCR. The host is too small to build on — 2 vCPU / 2 GB running
# Postgres, listmonk and Caddy — so the build has to happen here.
#
# See "The fork" in integrations/listmonk/LISTMONK-RUNBOOK.md.
name: Build arm64 image

on:
  push:
    branches:
      - master
      - "feat/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # GHCR requires a lowercase path; the org name is mixed case.
  IMAGE_NAME: erinos-holdings/listmonk

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          # The Makefile derives VERSION from `git describe --tags`.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # yarn 1.22.x is pinned via "packageManager" in the frontend package.json.
      - name: Enable corepack
        run: corepack enable

      # stuffbin runs ON the runner, so it must stay amd64. Install it before
      # GOARCH is switched to arm64 for the listmonk binary itself.
      - name: Install stuffbin
        run: go install github.com/knadh/stuffbin/...@latest

      - name: Build frontend
        run: make build-frontend

      - name: Build arm64 binary and pack static assets into it
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
        run: make build pack-bin

      # The upstream tag this branch is based on, so the image tag survives a
      # rebase onto a newer upstream release.
      - name: Resolve base version
        id: ver
        run: echo "base=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"

      # QEMU is needed because the Dockerfile has RUN steps (apk add, chmod)
      # that execute inside the arm64 image.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=${{ steps.ver.outputs.base }}-erinos.${{ github.run_number }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
